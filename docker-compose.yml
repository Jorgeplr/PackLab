services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-packlab}
      MYSQL_USER: ${DB_USER:-packlab}
      MYSQL_PASSWORD: ${DB_PASSWORD:-packlab}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-packlab}
      DB_USER: ${DB_USER:-packlab}
      DB_PASSWORD: ${DB_PASSWORD:-packlab}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto}
      FREE_EXPORTS: ${FREE_EXPORTS:-3}
    ports:
      - "${APP_PORT:-3000}:3000"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  db_data:
